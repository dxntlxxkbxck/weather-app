<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="style.css">

    <title>Weather App</title>
</head>

<body>

    <!-- основной контейнер приложения -->
    <main class="container">

        <!-- левая панель с текущими погодными данными -->
        <section class="left-info">

            <!-- затемняющий градиент поверх фонового изображения -->
            <div class="pic-gradient"></div>

            <!-- дата и выбранный город -->
            <div class="today-info">
                <h2>Загрузка...</h2>
                <span>Получение даты...</span>

                <div>
                    <i
                        class="bx bx-current-location"
                        aria-hidden="true"
                    ></i>
                    <span>Определение города...</span>
                </div>
            </div>

            <!-- температура и описание погоды -->
            <div class="today-weather">
                <i
                    class="bx bx-cloud"
                    aria-hidden="true"
                ></i>

                <h1 class="weather-temp">--°</h1>

                <h3>Загрузка погоды...</h3>
            </div>

        </section>

        <!-- правая панель с подробными данными -->
        <section class="right-info">

            <!-- осадки, влажность и скорость ветра -->
            <div class="day-info">
                <div>
                    <span class="title">Осадки</span>
                    <span class="value">--%</span>
                </div>

                <div>
                    <span class="title">Влажность</span>
                    <span class="value">--%</span>
                </div>

                <div>
                    <span class="title">Скорость ветра</span>
                    <span class="value">-- км/ч</span>
                </div>
            </div>

            <!-- прогноз создаётся динамически в index.js -->
            <ul class="days-list"></ul>

            <!-- форма поиска и сообщение о состоянии -->
            <div class="btn-container">
                <form class="search-form" novalidate>
                    <label class="visually-hidden" for="city-search">Город</label>
                    <input
                        class="city-input"
                        id="city-search"
                        type="search"
                        autocomplete="address-level2"
                        placeholder="Введите город"
                    >
                    <button
                        class="loc-button"
                        type="submit"
                    >
                        Найти
                    </button>
                </form>

                <p
                    class="status-message"
                    aria-live="polite"
                ></p>
            </div>

            <!-- история поиска -->
            <div class="history-panel">
                <span class="history-title">История поиска</span>
                <ul class="history-list"></ul>
            </div>

        </section>

    </main>

    <script type="module" src="index.js"></script>

</body>

</html>
